<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANGUARD — World-Class Digital Collective</title>

  <!-- Online Web Fonts: FSP DEMO - PODIUM Sharp 4.11 -->
  <link href="https://db.onlinewebfonts.com/c/8b75d9dcff6a48c35a46656192adf019?family=FSP+DEMO+-+PODIUM+Sharp+4.11" rel="stylesheet" />
  <!-- Google Fonts: Inter (400, 500, 600, 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            podium: ['"FSP DEMO - PODIUM Sharp 4.11"', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    @font-face {
      font-family: "FSP DEMO - PODIUM Sharp 4.11";
      src: url("https://db.onlinewebfonts.com/t/8b75d9dcff6a48c35a46656192adf019.eot");
      src: url("https://db.onlinewebfonts.com/t/8b75d9dcff6a48c35a46656192adf019.eot?#iefix") format("embedded-opentype"),
           url("https://db.onlinewebfonts.com/t/8b75d9dcff6a48c35a46656192adf019.woff2") format("woff2"),
           url("https://db.onlinewebfonts.com/t/8b75d9dcff6a48c35a46656192adf019.woff") format("woff"),
           url("https://db.onlinewebfonts.com/t/8b75d9dcff6a48c35a46656192adf019.ttf") format("truetype"),
           url("https://db.onlinewebfonts.com/t/8b75d9dcff6a48c35a46656192adf019.svg#FSP DEMO - PODIUM Sharp 4.11") format("svg");
      font-display: swap;
    }

    .font-podium {
      font-family: "FSP DEMO - PODIUM Sharp 4.11", sans-serif;
    }
    .font-inter {
      font-family: 'Inter', sans-serif;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scale-in {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-fade-up {
      opacity: 0;
      animation: fade-up 0.8s ease-out forwards;
    }
    .animate-fade-up-delay-1 {
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.2s forwards;
    }
    .animate-fade-up-delay-2 {
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.4s forwards;
    }
    .animate-fade-up-delay-3 {
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.6s forwards;
    }
    .animate-fade-up-delay-4 {
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.8s forwards;
    }
    .animate-fade-in {
      opacity: 0;
      animation: fade-in 0.8s ease-out forwards;
    }
    .animate-fade-in-delay {
      opacity: 0;
      animation: fade-in 0.8s ease-out 0.3s forwards;
    }
    .animate-scale-in {
      opacity: 0;
      animation: scale-in 0.8s ease-out forwards;
    }
  </style>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-white selection:bg-white selection:text-black overflow-hidden m-0 p-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Lucide Icons (Exact SVG path specifications)
    function ArrowUpRight({ className = "w-4 h-4" }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <line x1="7" y1="17" x2="17" y2="7" />
          <polyline points="7 7 17 7 17 17" />
        </svg>
      );
    }

    function Award({ className = "w-8 h-8" }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <circle cx="12" cy="8" r="7" />
          <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" />
        </svg>
      );
    }

    function Crown({ className = "w-4 h-4" }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.735H5.81a1 1 0 0 1-.957-.735L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" />
          <path d="M5 21h14" />
        </svg>
      );
    }

    function X({ className = "w-6 h-6" }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      );
    }

    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const navLinks = ["Projects", "Studio", "Offerings", "Inquire"];

      return (
        <main className="relative h-screen w-full overflow-hidden flex flex-col justify-between">
          {/* Background Video */}
          <video
            autoPlay
            muted
            loop
            playsInline
            className="absolute inset-0 w-full h-full object-cover z-0"
          >
            <source
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260606_154941_df1a96e1-a06f-450c-bd02-d863414cc1a0.mp4"
              type="video/mp4"
            />
          </video>

          {/* Dark Overlay for optimal text contrast */}
          <div className="absolute inset-0 bg-black/40 z-0 pointer-events-none" />

          {/* Navbar */}
          <header className="relative z-20 w-full flex items-center justify-between px-6 sm:px-10 lg:px-16 py-5 lg:py-7">
            {/* Left: Brand Name */}
            <div className="font-podium text-white font-bold uppercase text-2xl sm:text-3xl tracking-wider select-none">
              VANGUARD
            </div>

            {/* Center (Desktop only, hidden below md) */}
            <nav className="hidden md:flex items-center gap-8 lg:gap-12">
              {navLinks.map((link) => (
                <a
                  key={link}
                  href={`#${link.toLowerCase()}`}
                  className="font-inter text-sm text-white/80 tracking-widest uppercase transition-colors duration-200 hover:text-white"
                >
                  {link}
                </a>
              ))}
            </nav>

            {/* Right (Desktop): GET IN TOUCH Bordered Button */}
            <div className="hidden md:block">
              <a
                href="#inquire"
                className="inline-flex items-center gap-2 border border-white/30 hover:border-white/60 px-6 py-3 text-xs tracking-widest uppercase hover:bg-white/10 text-white font-inter transition-all duration-200"
              >
                <span>GET IN TOUCH</span>
                <ArrowUpRight className="w-3.5 h-3.5" />
              </a>
            </div>

            {/* Right (Mobile, visible below md): Hamburger Button */}
            <button
              type="button"
              onClick={() => setMenuOpen(true)}
              className="md:hidden flex flex-col items-end space-y-1.5 p-2 focus:outline-none"
              aria-label="Open Menu"
            >
              <div className="w-6 h-0.5 bg-white" />
              <div className="w-6 h-0.5 bg-white" />
              <div className="w-4 h-0.5 bg-white" />
            </button>
          </header>

          {/* Mobile Menu Overlay */}
          <div
            className={`fixed inset-0 z-50 bg-black/95 backdrop-blur-sm transition-all duration-500 md:hidden flex flex-col justify-between px-6 sm:px-10 py-5 ${
              menuOpen ? "opacity-100 visible pointer-events-auto" : "opacity-0 invisible pointer-events-none"
            }`}
          >
            {/* Overlay Header */}
            <div className="flex items-center justify-between w-full">
              <div className="font-podium text-white font-bold uppercase text-2xl sm:text-3xl tracking-wider">
                VANGUARD
              </div>
              <button
                type="button"
                onClick={() => setMenuOpen(false)}
                className="text-white hover:text-white/70 transition-colors p-2"
                aria-label="Close Menu"
              >
                <X className="w-6 h-6" />
              </button>
            </div>

            {/* Overlay Navigation Links with Staggered Animations */}
            <div className="flex flex-col items-center justify-center space-y-7 my-auto">
              {navLinks.map((link, i) => (
                <a
                  key={link}
                  href={`#${link.toLowerCase()}`}
                  onClick={() => setMenuOpen(false)}
                  style={{
                    transitionDelay: `${i * 80 + 100}ms`,
                    transform: menuOpen ? "translateY(0)" : "translateY(20px)",
                    opacity: menuOpen ? 1 : 0,
                  }}
                  className="font-podium text-4xl sm:text-5xl text-white uppercase tracking-wider transition-all duration-500 hover:text-white/70"
                >
                  {link}
                </a>
              ))}

              <div
                style={{
                  transitionDelay: `${navLinks.length * 80 + 100}ms`,
                  transform: menuOpen ? "translateY(0)" : "translateY(20px)",
                  opacity: menuOpen ? 1 : 0,
                }}
                className="pt-4 transition-all duration-500"
              >
                <a
                  href="#inquire"
                  onClick={() => setMenuOpen(false)}
                  className="inline-flex items-center gap-2 border border-white/30 hover:border-white/60 px-8 py-3.5 text-xs tracking-widest uppercase hover:bg-white/10 text-white font-inter transition-all duration-200"
                >
                  <span>GET IN TOUCH</span>
                  <ArrowUpRight className="w-4 h-4" />
                </a>
              </div>
            </div>

            {/* Bottom spacer / footer note */}
            <div className="text-center text-white/40 text-[10px] tracking-widest uppercase py-2">
              © {new Date().getFullYear()} VANGUARD COLLECTIVE
            </div>
          </div>

          {/* Hero Content (vertically centered, left-aligned) */}
          <div className="relative z-10 w-full px-6 sm:px-10 lg:px-16 my-auto max-w-7xl">
            {/* 1. Tagline */}
            <div className="flex items-center gap-2.5 mb-6 lg:mb-8 animate-fade-up">
              <Crown className="w-4 h-4 text-white/70 shrink-0" />
              <span className="text-white/70 text-xs sm:text-sm font-inter tracking-[0.3em] uppercase">
                World-Class Digital Collective
              </span>
            </div>

            {/* 2. Main Heading */}
            <h1 className="font-podium text-white uppercase leading-[0.92] tracking-tight animate-fade-up-delay-1 select-none">
              <span className="block text-[clamp(2.8rem,8vw,7rem)]">Design.</span>
              <span className="block text-[clamp(2.8rem,8vw,7rem)]">Disrupt.</span>
              <span className="block text-[clamp(2.8rem,8vw,7rem)]">Conquer.</span>
            </h1>

            {/* 3. Subtext */}
            <p className="mt-6 lg:mt-8 text-white/70 text-sm sm:text-base font-inter leading-relaxed max-w-md animate-fade-up-delay-2">
              We build fierce brand identities<br />
              that don't just turn heads — <strong className="font-bold text-white">they lead.</strong>
            </p>

            {/* 4. CTA Row */}
            <div className="mt-8 lg:mt-10 flex flex-wrap items-center gap-4 sm:gap-6 animate-fade-up-delay-3">
              <a
                href="#work"
                className="group inline-flex items-center gap-2.5 bg-black hover:bg-neutral-900 text-white px-5 sm:px-7 py-3 sm:py-4 text-[11px] sm:text-xs tracking-widest uppercase font-inter transition-colors duration-200"
              >
                <span>SEE OUR WORK</span>
                <ArrowUpRight className="w-3.5 h-3.5 transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" />
              </a>

              <div className="hidden sm:flex items-center gap-3">
                <Award className="w-8 h-8 text-white/50 shrink-0" />
                <div className="text-white/60 text-xs tracking-wider uppercase font-inter leading-snug">
                  <div>Top-Rated</div>
                  <div>Brand Studio</div>
                </div>
              </div>
            </div>

            {/* 5. Stats Row */}
            <div className="mt-8 sm:mt-10 lg:mt-14 flex flex-wrap gap-6 sm:gap-12 lg:gap-16 animate-fade-up-delay-4">
              <div>
                <div className="font-inter text-white text-2xl sm:text-4xl lg:text-5xl font-bold tracking-tight">
                  250+
                </div>
                <div className="text-white/50 text-[9px] sm:text-xs tracking-widest uppercase font-inter mt-1">
                  Brands Transformed
                </div>
              </div>

              <div>
                <div className="font-inter text-white text-2xl sm:text-4xl lg:text-5xl font-bold tracking-tight">
                  95%
                </div>
                <div className="text-white/50 text-[9px] sm:text-xs tracking-widest uppercase font-inter mt-1">
                  Client Retention
                </div>
              </div>

              <div>
                <div className="font-inter text-white text-2xl sm:text-4xl lg:text-5xl font-bold tracking-tight">
                  10+
                </div>
                <div className="text-white/50 text-[9px] sm:text-xs tracking-widest uppercase font-inter mt-1">
                  Years in the Game
                </div>
              </div>
            </div>
          </div>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
